<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMB - Funnel Comercial y Gestión</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (18) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts (Using a specific version that plays nicer with UMD and React 18) -->
    <script crossorigin src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script crossorigin src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        corporate: {
                            900: '#0F172A',
                            800: '#1E293B',
                            700: '#334155',
                            100: '#F1F5F9',
                        },
                        brand: {
                            500: '#3B82F6',
                            600: '#2563EB',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #F8FAFC; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { BarChart, Bar, XAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell } = window.Recharts;

        const MOCK_LAST_UPDATED = new Date().toLocaleString('es-CO');
        const DATA_QUALITY_CRITICAL = false; // Cambiar a true para ver la alerta

        const rawLeads = [
            { id: 'L-101', status: 'Nuevo', creation: '2026-09-10T08:00:00', last_status: '2026-09-10T08:00:00', origin: 'Inbound', size: 'SMB', company: 'Tech Solutions SAS', manager: 'carlos.m@bold.co', owner: 'ana.p@bold.co' },
            { id: 'L-102', status: 'Calificado', creation: '2026-09-12T10:00:00', last_status: '2026-09-14T11:00:00', origin: 'Outbound', size: 'SMB', company: 'Comercializadora Sur', manager: 'carlos.m@bold.co', owner: 'luis.g@bold.co' },
            { id: 'L-103', status: 'Convertido', creation: '2026-09-01T09:00:00', last_status: '2026-09-05T14:00:00', origin: 'Inbound', size: 'SMB', company: 'Restaurante El Paisa', manager: 'laura.v@bold.co', owner: 'jorge.r@bold.co' },
            { id: 'L-104', status: 'Descartado', creation: '2026-09-15T09:00:00', last_status: '2026-09-16T14:00:00', origin: 'Referidos', size: 'SMB', company: 'Inversiones ABC', manager: 'laura.v@bold.co', owner: 'jorge.r@bold.co' }
        ];

        const rawOpps = [
            { id: 'O-201', status: 'Iniciada', creation: '2026-09-06T09:00:00', last_status: '2026-09-06T09:00:00', origin: 'Inbound', product: 'QR', size: 'SMB', company: 'Restaurante El Paisa', manager: 'laura.v@bold.co', owner: 'jorge.r@bold.co', approved: 0, disbursed: 0 },
            { id: 'O-202', status: 'En Negociación', creation: '2026-09-02T10:00:00', last_status: '2026-09-03T11:00:00', origin: 'Outbound', product: 'TERMINAL', size: 'SMB', company: 'Supermercado Central', manager: 'carlos.m@bold.co', owner: 'ana.p@bold.co', approved: 15000000, disbursed: 0 },
            { id: 'O-203', status: 'Ganada', creation: '2026-08-25T10:00:00', last_status: '2026-09-10T11:00:00', origin: 'Referidos', product: 'PAYMENT_LINK', size: 'SMB', company: 'Moda Express', manager: 'laura.v@bold.co', owner: 'luis.g@bold.co', approved: 5000000, disbursed: 5000000 },
            { id: 'O-204', status: 'Perdida', creation: '2026-09-01T10:00:00', last_status: '2026-09-05T11:00:00', origin: 'Inbound', product: 'TERMINAL', size: 'SMB', company: 'Cafetería Roma', manager: 'carlos.m@bold.co', owner: 'ana.p@bold.co', approved: 0, disbursed: 0 },
            { id: 'O-205', status: 'En Negociación', creation: '2026-08-15T10:00:00', last_status: '2026-08-20T11:00:00', origin: 'Inbound', product: 'TERMINAL', size: 'SMB', company: 'Llantas y Servicios', manager: 'laura.v@bold.co', owner: 'jorge.r@bold.co', approved: 25000000, disbursed: 0 }, // Inactiva por > 15 dias
        ];

        // Simulando datos de tareas para alimentar métricas operativas
        const rawTasks = [
            { id: 'T-1', entity_id: 'O-202', type: 'Llamada', status: 'PENDING', date: '2026-09-19T10:00:00' }, // Pendiente
            { id: 'T-2', entity_id: 'O-205', type: 'Seguimiento', status: 'PENDING', date: '2026-09-10T10:00:00' }, // Vencida
            { id: 'T-3', entity_id: 'L-101', type: 'Email', status: 'COMPLETED', date: '2026-09-12T10:00:00' }
        ];

        const formatCurrency = (val) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(val || 0);
        
        const formatName = (email) => {
            if (!email) return 'N/A';
            return email.split('@')[0].replace('.', ' ').replace(/\b\w/g, l => l.toUpperCase());
        };
        const getDaysDiff = (dateStr) => {
            const today = new Date('2026-09-18T12:00:00'); // Fijo según contexto actual
            const past = new Date(dateStr);
            const diffTime = Math.abs(today - past);
            return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        };
        const isOverdue = (dateStr) => {
            const today = new Date('2026-09-18T12:00:00');
            const taskDate = new Date(dateStr);
            return taskDate < today;
        };

        const App = () => {
            // Estados de filtros
            const [managerFilter, setManagerFilter] = useState('ALL');
            const [ownerFilter, setOwnerFilter] = useState('ALL');

            // Efecto para íconos
            useEffect(() => {
                lucide.createIcons();
            }, []);

            const { unifiedData, kpis, funnels, charts } = useMemo(() => {
                // Filtrado base de seguridad
                let leads = rawLeads.filter(l => l.size === 'SMB');
                let opps = rawOpps.filter(o => o.size === 'SMB');
                
                // Aplicar filtros de usuario
                if (managerFilter !== 'ALL') {
                    leads = leads.filter(l => l.manager === managerFilter);
                    opps = opps.filter(o => o.manager === managerFilter);
                }
                if (ownerFilter !== 'ALL') {
                    leads = leads.filter(l => l.owner === ownerFilter);
                    opps = opps.filter(o => o.owner === ownerFilter);
                }

                // Cálculo de KPIs
                const leadsTotales = leads.length;
                const leadsCalif = leads.filter(l => l.status === 'Calificado').length;
                const leadsConv = leads.filter(l => l.status === 'Convertido').length;
                
                const oppsTotales = opps.length;
                const oppsGanadas = opps.filter(o => o.status === 'Ganada').length;
                const oppsPerdidas = opps.filter(o => o.status === 'Perdida').length;
                const montoAprobado = opps.reduce((sum, o) => sum + (o.approved || 0), 0);
                const montoDesembolsado = opps.reduce((sum, o) => sum + (o.disbursed || 0), 0);

                // Tareas
                const activeEntityIds = new Set([...leads.map(l=>l.id), ...opps.map(o=>o.id)]);
                const relevantTasks = rawTasks.filter(t => activeEntityIds.has(t.entity_id));
                const pendingTasks = relevantTasks.filter(t => t.status === 'PENDING');
                const overdueTasks = pendingTasks.filter(t => isOverdue(t.date));

                // Construcción de tabla unificada
                let table = [];
                
                // Procesar Leads
                leads.forEach(l => {
                    const lTasks = relevantTasks.filter(t => t.entity_id === l.id && t.status === 'PENDING');
                    const nextTask = lTasks.sort((a,b) => new Date(a.date) - new Date(b.date))[0];
                    table.push({
                        type: 'Lead', id: l.id, company: l.company, manager: formatName(l.manager), owner: formatName(l.owner),
                        status: l.status, origin: l.origin, product: 'N/A', creation: l.creation.split('T')[0],
                        last_activity: l.last_status.split('T')[0], daysWithoutActivity: getDaysDiff(l.last_status),
                        next_task: nextTask ? nextTask.type : 'Ninguna',
                        hasOverdueTask: nextTask ? isOverdue(nextTask.date) : false,
                        approved: null, disbursed: null, risk_score: 0
                    });
                });

                // Procesar Oportunidades
                opps.forEach(o => {
                    const oTasks = relevantTasks.filter(t => t.entity_id === o.id && t.status === 'PENDING');
                    const nextTask = oTasks.sort((a,b) => new Date(a.date) - new Date(b.date))[0];
                    const daysInactive = getDaysDiff(o.last_status);
                    const isOverdueTask = nextTask ? isOverdue(nextTask.date) : false;
                    
                    // Lógica de Risk Score para Sorting Priorizado
                    let score = 0;
                    if (isOverdueTask) score = 1000;
                    else if (daysInactive > 15 && !['Ganada', 'Perdida'].includes(o.status)) score = 500;
                    else if (o.status === 'En Negociación') score = 300 + ((o.approved || 0) / 10000000);
                    else score = (o.approved || 0) / 100000000;

                    table.push({
                        type: 'Oportunidad', id: o.id, company: o.company, manager: formatName(o.manager), owner: formatName(o.owner),
                        status: o.status, origin: o.origin, product: o.product, creation: o.creation.split('T')[0],
                        last_activity: o.last_status.split('T')[0], daysWithoutActivity: daysInactive,
                        next_task: nextTask ? nextTask.type : 'Ninguna',
                        hasOverdueTask: isOverdueTask,
                        approved: o.approved, disbursed: o.disbursed, risk_score: score
                    });
                });

                // Ordenar tabla
                table.sort((a, b) => b.risk_score - a.risk_score);

                // Agregados para gráficos
                const originAgg = opps.reduce((acc, o) => { acc[o.origin] = (acc[o.origin]||0)+1; return acc; }, {});
                const originChart = Object.keys(originAgg).map(k => ({ name: k, value: originAgg[k] }));

                const managerAgg = opps.reduce((acc, o) => {
                    const m = formatName(o.manager);
                    if(!acc[m]) acc[m] = { name: m, ganadas: 0, monto: 0 };
                    if(o.status === 'Ganada') { acc[m].ganadas += 1; acc[m].monto += o.approved; }
                    return acc;
                }, {});

                return {
                    unifiedData: table,
                    kpis: {
                        leadsTotales, leadsCalif, leadsConv,
                        oppsTotales, oppsGanadas, oppsPerdidas,
                        montoAprobado, montoDesembolsado,
                        pendingTasks: pendingTasks.length, overdueTasks: overdueTasks.length
                    },
                    funnels: {
                        leads: [
                            { step: 'Nuevos', count: leads.filter(l=>l.status==='Nuevo').length, color: 'bg-blue-200' },
                            { step: 'Calificados', count: leadsCalif, color: 'bg-blue-400' },
                            { step: 'Convertidos', count: leadsConv, color: 'bg-blue-600' }
                        ],
                        opps: [
                            { step: 'Iniciadas', count: opps.filter(o=>o.status==='Iniciada').length, color: 'bg-purple-200' },
                            { step: 'En Negociación', count: opps.filter(o=>o.status==='En Negociación').length, color: 'bg-purple-400' },
                            { step: 'Ganadas', count: oppsGanadas, color: 'bg-purple-600' }
                        ]
                    },
                    charts: {
                        origin: originChart,
                        manager: Object.values(managerAgg)
                    }
                };
            }, [managerFilter, ownerFilter]);

            const uniqueManagers = [...new Set([...rawLeads, ...rawOpps].map(x => x.manager))];
            const uniqueOwners = [...new Set([...rawLeads, ...rawOpps].map(x => x.owner))];
            const COLORS = ['#3B82F6', '#8B5CF6', '#10B981', '#F59E0B'];

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col">
                    {/* Header & Global Alerts */}
                    <header className="bg-corporate-900 text-white p-4 shadow-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h1 className="text-xl font-bold flex items-center gap-2">
                                    <i data-lucide="briefcase"></i>
                                    Dashboard Gestión Comercial SMB
                                </h1>
                                <p className="text-xs text-slate-300">Última act: {MOCK_LAST_UPDATED} | Fuente: G-Sheets (Auth)</p>
                            </div>
                            <div className="flex gap-4">
                                <select className="bg-corporate-800 text-sm border-none rounded p-2 text-white" value={managerFilter} onChange={e => setManagerFilter(e.target.value)}>
                                    <option value="ALL">Todos los Managers</option>
                                    {uniqueManagers.map(m => <option key={m} value={m}>{formatName(m)}</option>)}
                                </select>
                                <select className="bg-corporate-800 text-sm border-none rounded p-2 text-white" value={ownerFilter} onChange={e => setOwnerFilter(e.target.value)}>
                                    <option value="ALL">Todos los Responsables</option>
                                    {uniqueOwners.map(o => <option key={o} value={o}>{formatName(o)}</option>)}
                                </select>
                            </div>
                        </div>
                    </header>

                    {DATA_QUALITY_CRITICAL && (
                        <div className="bg-red-500 text-white p-2 text-center text-sm font-semibold flex justify-center items-center gap-2">
                            <i data-lucide="alert-triangle" className="w-4 h-4"></i>
                            Alerta Crítica: Inconsistencias detectadas en la tabla 'data_quality'. Verifica los datos fuente.
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto p-4 w-full flex-1 flex flex-col gap-6">
                        
                        {/* KPIs Grid */}
                        <section className="grid grid-cols-2 md:grid-cols-5 gap-4">
                            <KpiCard title="Leads Totales" value={kpis.leadsTotales} icon="users" color="text-blue-600" />
                            <KpiCard title="Leads Calificados" value={kpis.leadsCalif} icon="check-circle" color="text-blue-500" />
                            <KpiCard title="Leads Convertidos" value={kpis.leadsConv} icon="arrow-right-circle" color="text-blue-700" />
                            <KpiCard title="Opps Totales" value={kpis.oppsTotales} icon="target" color="text-purple-600" />
                            <KpiCard title="Opps Ganadas" value={kpis.oppsGanadas} icon="award" color="text-green-600" />
                            
                            <KpiCard title="Monto Aprobado" value={formatCurrency(kpis.montoAprobado)} icon="dollar-sign" color="text-green-700" />
                            <KpiCard title="Monto Desemb." value={formatCurrency(kpis.montoDesembolsado)} icon="banknote" color="text-green-500" />
                            <KpiCard title="Tareas Pendientes" value={kpis.pendingTasks} icon="clock" color="text-amber-500" />
                            <KpiCard title="Tareas Vencidas" value={kpis.overdueTasks} icon="alert-circle" color="text-red-500" bg="bg-red-50" />
                            <KpiCard title="Opps Perdidas" value={kpis.oppsPerdidas} icon="x-circle" color="text-slate-400" />
                        </section>

                        {/* Middle Section: Funnels & Charts */}
                        <section className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* Funnels (Visual CSS) */}
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col gap-6 col-span-1">
                                <div>
                                    <h3 className="text-sm font-semibold text-slate-700 mb-3">Funnel de Leads</h3>
                                    <div className="flex flex-col gap-1">
                                        {funnels.leads.map((f, i) => (
                                            <div key={f.step} className="flex items-center text-xs">
                                                <div className={`${f.color} h-6 flex items-center px-2 text-white font-medium rounded-r-md`} style={{width: `${Math.max(20, (f.count / kpis.leadsTotales) * 100)}%`}}>
                                                    {f.count}
                                                </div>
                                                <span className="ml-2 text-slate-600">{f.step}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <h3 className="text-sm font-semibold text-slate-700 mb-3">Funnel de Oportunidades</h3>
                                    <div className="flex flex-col gap-1">
                                        {funnels.opps.map((f, i) => (
                                            <div key={f.step} className="flex items-center text-xs">
                                                <div className={`${f.color} h-6 flex items-center px-2 text-white font-medium rounded-r-md`} style={{width: `${Math.max(20, (f.count / kpis.oppsTotales) * 100)}%`}}>
                                                    {f.count}
                                                </div>
                                                <span className="ml-2 text-slate-600">{f.step}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Charts */}
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 col-span-1">
                                <h3 className="text-sm font-semibold text-slate-700 mb-2">Orígenes (Opps)</h3>
                                <div className="h-48">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <PieChart>
                                            <Pie data={charts.origin} cx="50%" cy="50%" innerRadius={40} outerRadius={70} paddingAngle={5} dataKey="value">
                                                {charts.origin.map((entry, index) => <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />)}
                                            </Pie>
                                            <Tooltip />
                                        </PieChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 col-span-1">
                                <h3 className="text-sm font-semibold text-slate-700 mb-2">Monto Ganado x Manager</h3>
                                <div className="h-48">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={charts.manager} margin={{ top: 5, right: 5, left: 20, bottom: 5 }}>
                                            <XAxis dataKey="name" tick={{fontSize: 10}} />
                                            <Tooltip formatter={(value) => formatCurrency(value)} />
                                            <Bar dataKey="monto" fill="#10B981" radius={[4, 4, 0, 0]} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </section>

                        {/* Prioritized Management Table */}
                        <section className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden flex flex-col flex-1">
                            <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                <h2 className="text-base font-bold text-slate-800">Mesa de Gestión Priorizada</h2>
                                <span className="text-xs text-slate-500 flex items-center gap-1">
                                    <i data-lucide="info" className="w-3 h-3"></i>
                                    Orden: Tareas Vencidas &gt; Inactividad &gt; Negociación &gt; Monto
                                </span>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm text-slate-600 whitespace-nowrap">
                                    <thead className="bg-slate-100 text-slate-700 text-xs uppercase font-semibold">
                                        <tr>
                                            <th className="px-4 py-3">Riesgo</th>
                                            <th className="px-4 py-3">Entidad</th>
                                            <th className="px-4 py-3">Empresa</th>
                                            <th className="px-4 py-3">Responsable</th>
                                            <th className="px-4 py-3">Estado</th>
                                            <th className="px-4 py-3">Próx. Tarea</th>
                                            <th className="px-4 py-3">Inactividad</th>
                                            <th className="px-4 py-3">Monto Aprob.</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {unifiedData.length === 0 ? (
                                            <tr><td colSpan="8" className="text-center py-8 text-slate-400">No hay datos que coincidan con los filtros.</td></tr>
                                        ) : unifiedData.map((row, idx) => (
                                            <tr key={row.id} className="hover:bg-slate-50 transition-colors">
                                                <td className="px-4 py-3">
                                                    {row.hasOverdueTask ? <span className="flex w-3 h-3 bg-red-500 rounded-full" title="Tarea Vencida"></span> : 
                                                     (row.daysWithoutActivity > 15 && !['Ganada', 'Perdida'].includes(row.status)) ? <span className="flex w-3 h-3 bg-amber-400 rounded-full" title="Riesgo de Inactividad"></span> : 
                                                     <span className="flex w-3 h-3 bg-green-500 rounded-full" title="Al Día"></span>}
                                                </td>
                                                <td className="px-4 py-3">
                                                    <span className="font-medium text-slate-900">{row.id}</span>
                                                    <span className="block text-xs text-slate-400">{row.type}</span>
                                                </td>
                                                <td className="px-4 py-3 font-medium">{row.company}</td>
                                                <td className="px-4 py-3">
                                                    <span className="text-slate-800">{row.owner}</span>
                                                    <span className="block text-xs text-slate-400">{row.manager}</span>
                                                </td>
                                                <td className="px-4 py-3">
                                                    <span className={`px-2 py-1 rounded-full text-xs font-medium 
                                                        ${row.status.includes('Ganada') || row.status.includes('Convertido') ? 'bg-green-100 text-green-700' : 
                                                          row.status.includes('Perdida') || row.status.includes('Descartado') ? 'bg-slate-100 text-slate-600' : 
                                                          'bg-blue-100 text-blue-700'}`}>
                                                        {row.status}
                                                    </span>
                                                </td>
                                                <td className="px-4 py-3">
                                                    <span className={row.hasOverdueTask ? 'text-red-600 font-semibold flex items-center gap-1' : 'text-slate-600'}>
                                                        {row.hasOverdueTask && <i data-lucide="alert-circle" className="w-3 h-3"></i>}
                                                        {row.next_task}
                                                    </span>
                                                </td>
                                                <td className="px-4 py-3">{row.daysWithoutActivity} días</td>
                                                <td className="px-4 py-3 font-semibold text-slate-700">{row.approved !== null ? formatCurrency(row.approved) : 'N/A'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </section>
                </main>
            </div>
        );
    };

    const KpiCard = ({ title, value, icon, color, bg = 'bg-white' }) => (
        <div className={`${bg} p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between`}>
                <div className="flex justify-between items-start mb-2">
                    <span className="text-xs font-semibold text-slate-500 uppercase tracking-wide">{title}</span>
                    <i data-lucide={icon} className={`w-4 h-4 ${color}`}></i>
                </div>
                <span className="text-2xl font-bold text-slate-800">{value}</span>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
